name: Fetch Trends

on:
  schedule:
    # 1時間に1回（毎時0分）。回数を減らす場合は例: "0 */6 * * *"（6時間ごと）
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: トレンドデータを取得・保存
        run: node scripts/fetch-trends.cjs
        timeout-minutes: 3
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_AFF_ID: ${{ secrets.RAKUTEN_AFF_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}

      - name: 今日の話題（テクノロジーTOP3）を作成
        run: node scripts/make-topics.cjs "$(TZ=Asia/Tokyo date +%Y-%m-%d)"

      - name: 変更をコミット & プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ src/content/topics/
          git diff --cached --quiet || git commit -m "chore: update trends $(date +'%Y-%m-%d %H:%M JST')"
          git push
